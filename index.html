<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>千研投资 · 公司档案</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-size:15px}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;color:#1f1f1f;background:#f5f7fa;display:flex}

.sidebar{width:270px;min-width:270px;background:#1a2639;color:#d0d8e4;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.sidebar .head{padding:18px 16px 10px;font-size:15px;font-weight:700;color:#fff;letter-spacing:1px}
.sidebar .sub{padding:0 16px 12px;font-size:11px;color:#7a8aaa;border-bottom:1px solid #2a3a55}
.sidebar .search{padding:10px 12px}
.sidebar .search input{width:100%;padding:7px 10px;border-radius:5px;border:1px solid #2a3a55;background:#1f2d45;color:#d0d8e4;font-size:12px;outline:none;font-family:inherit}
.sidebar .search input:focus{border-color:#4a7acc}
.sidebar .list{flex:1;overflow-y:auto;padding:4px 0}
.sidebar .list::-webkit-scrollbar{width:4px}
.sidebar .list::-webkit-scrollbar-thumb{background:#3a4a6a;border-radius:2px}
.citem{display:flex;align-items:center;justify-content:space-between;padding:7px 16px;cursor:pointer;transition:background .12s;border-left:3px solid transparent}
.citem:hover{background:#1f2d45}
.citem.on{background:#23324d;border-left-color:#4a7acc}
.cnm{font-size:13px;color:#d0d8e4}
.ccd{font-size:10px;color:#5a7a9a;font-family:"JetBrains Mono",monospace}
.crt{font-size:10px;padding:1px 6px;border-radius:5px;font-weight:600}
.s1{background:#2a4a7a;color:#8ab4f8}
.s2{background:#1a3a6a;color:#6a9aee}
.s3{background:#3a4a6a;color:#8aa0c0}
.s4{background:#4a4a4a;color:#aaa}
.dot{width:5px;height:5px;border-radius:50%;margin-right:7px;flex-shrink:0}
.d1{background:#4a7acc}
.d2{background:#c9a84c}
.d3{background:#c97a4a}
.d4{background:#7a8aaa}

.main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{display:flex;align-items:center;gap:3px;padding:10px 16px;background:#fff;border-bottom:1px solid #e2e8f0;overflow-x:auto;flex-shrink:0}
.topbar::-webkit-scrollbar{height:2px}
.topbar::-webkit-scrollbar-thumb{background:#d0d8e0}
.tbtn{padding:5px 12px;font-size:12px;border-radius:5px;border:none;cursor:pointer;white-space:nowrap;background:transparent;color:#5a6a7a;font-family:inherit;transition:all .12s}
.tbtn:hover{background:#f0f4f9;color:#1f4ea8}
.tbtn.on{background:#1f4ea8;color:#fff;font-weight:600}
.ph{display:flex;align-items:center;padding:10px 16px;font-size:13px;color:#8a9aaa;flex-shrink:0;background:#fff;border-bottom:1px solid #e2e8f0}

.page{flex:1;overflow-y:auto;padding:24px 28px 60px;max-width:900px;margin:0 auto;font-size:15px;color:#14181f;line-height:1.65;width:100%}
.page::-webkit-scrollbar{width:6px}
.page::-webkit-scrollbar-thumb{background:#d0d8e0;border-radius:3px}
.page h1{font-size:20px;font-weight:700;margin:0 0 10px;color:#1a365d}
.page h2{font-size:1.2rem;font-weight:700;color:#1a365d;margin:1.8em 0 .6em;padding-bottom:6px;border-bottom:2px solid #dde2ea}
.page h3{font-size:1.05rem;font-weight:600;color:#3c4451;margin:1.4em 0 .5em}
.page p{margin-bottom:1em;text-align:justify}
.page hr{border:none;height:1px;background:#dde2ea;margin:1.8em 0}
.page blockquote{margin:1em 0;padding:12px 16px;background:#f7f3eb;border-left:4px solid #b85a20;color:#4a3a2a;font-size:14px;line-height:1.5;border-radius:0 4px 4px 0}
.page blockquote p{margin-bottom:0}
.page strong{color:#14181f;font-weight:700}
.page code{font-family:"JetBrains Mono","SF Mono",monospace;background:#e8edf5;padding:2px 6px;border-radius:3px;font-size:13px;color:#1f4ea8}
.page pre{background:#f1f4f9;border:1px solid #dde2ea;border-radius:6px;padding:14px 18px;margin:12px 0;overflow-x:auto;font-size:13px;line-height:1.5;font-family:"JetBrains Mono","SF Mono",monospace;color:#16213a}
.page pre code{background:none;padding:0;color:#16213a}
.page li{margin-bottom:4px;line-height:1.6;margin-left:20px}
.page table{width:100%;border-collapse:collapse;margin:1em 0;font-size:13px;line-height:1.5;overflow-x:auto;display:block}
.page table th{background:#1f4ea8;color:#fff;font-weight:600;padding:8px 12px;border:1px solid #1f4ea8;text-align:left;font-size:12px}
.page table td{padding:7px 12px;border:1px solid #dde2ea;vertical-align:top}
.page table tbody tr:nth-child(even) td{background:#fafbfd}
.page table tbody tr:hover td{background:#e8edf5;cursor:pointer}
.page .pos{color:#1c6e3d;font-weight:600}
.page .neg{color:#a32a2a;font-weight:600}
.page .warn{color:#c97a1a;font-weight:600}
.wlc{text-align:center;padding:60px 20px;color:#8a9aaa}
.wlc h2{font-size:22px;color:#1a365d;margin-bottom:12px;border:none;padding:0}
.wlc p{font-size:14px;line-height:1.8;border:none}
.ld{text-align:center;padding:40px;color:#8a9aaa;font-size:14px}
</style>
</head>
<body>

<div class="sidebar">
<div class="head">千研投资</div>
<div class="sub">公司档案</div>
<div class="search"><input id="q" placeholder="搜索公司..." oninput="go()"></div>
<div class="list" id="ls"></div>
</div>

<div class="main">
<div class="ph" id="nav">从左侧选择一家公司</div>
<div class="page" id="pg"><div class="wlc"><h2>千研投资 · 公司档案</h2><p>制造业价值投资分析框架驱动的深度研究<br>从左侧列表选择一家公司开始浏览</p></div></div>
</div>

<script>
var C=[], sel=null, cix=null;
var cards=['gailan','shangye','chengzhang','yingli','guzhi','fengxian','yingxiang','luoji','genzong','licheng','biangeng'];
var cname=['总览','商业模式','成长性','盈利能力','估值','风险','影响因素','逻辑链路','跟踪清单','发展历程','变更记录'];
var fmap={'gailan':'海大集团总览','shangye':'商业模式','chengzhang':'成长性','yingli':'盈利能力','guzhi':'估值','fengxian':'风险','yingxiang':'影响因素','luoji':'逻辑链路','genzong':'跟踪清单','licheng':'公司发展历程','biangeng':'变更记录'};

fetch('data/companies.json').then(function(r){return r.json()}).then(function(d){
  C=d; go();
}).catch(function(){document.getElementById('ls').innerHTML='<div style="padding:20px;color:#a32a2a">加载失败</div>'});

function go(){
  var q=(document.getElementById('q').value||'').trim().toLowerCase();
  var h='';
  for(var i=0;i<C.length;i++){
    var c=C[i];if(q&&c.name.indexOf(q)<0&&c.name.toLowerCase().indexOf(q)<0&&c.code.toLowerCase().indexOf(q)<0)continue;
    var rk=c.rating.replace('+','').replace('-','_');
    var dot={'重点跟踪':'d1','等待观察':'d2','博反弹':'d3','研究对照':'d4'}[c.category]||'d4';
    var cl='s1';if(rk=='A')cl='s2';if(rk=='A_')cl='s3';if(rk=='B'||rk=='B_')cl='s4';
    var act=(sel&&sel.id==c.id)?'on':'';
    h+='<div class="citem '+act+'" onclick="pick(\''+c.id+'\')"><div style="display:flex;align-items:center"><span class="dot '+dot+'"></span><div><div class="cnm">'+c.name+'</div><div class="ccd">'+c.code+'</div></div></div><span class="crt '+cl+'">'+c.rating+'</span></div>';
  }
  document.getElementById('ls').innerHTML=h||'<div style="padding:20px;color:#5a7a9a;text-align:center;font-size:13px">无匹配</div>';
}

function pick(id){
  for(var i=0;i<C.length;i++)if(C[i].id==id){sel=C[i];cix=i;break;}
  go();
  var h='';for(var i=0;i<cards.length;i++)h+='<button class="tbtn" onclick="ld(\''+cards[i]+'\',this)">'+cname[i]+'</button>';
  document.getElementById('nav').innerHTML=h;
  ld('gailan',document.querySelector('.tbtn'));
}

function ld(k,btn){
  var b=document.querySelectorAll('.tbtn');for(var i=0;i<b.length;i++)b[i].classList.remove('on');
  if(btn)btn.classList.add('on');
  document.getElementById('pg').innerHTML='<div class="ld">加载中...</div>';
  var fn=fmap[k];if(!fn)return;
  fetch(sel.id+'/'+fn+'.html').then(function(r){if(!r.ok)throw Error('404');return r.text()}).then(function(html){
    var d=document.createElement('div');d.innerHTML=html;
    var body=d.querySelector('.body');var h=d.querySelector('.header h1');
    var out=h?'<h1>'+h.textContent+'</h1>':'<h1>'+sel.name+'</h1>';
    out+=body?body.innerHTML:'<p>内容加载失败</p>';
    document.getElementById('pg').innerHTML=out;
  }).catch(function(e){document.getElementById('pg').innerHTML='<div class="ld">加载失败: '+e.message+'</div>'});
}
</script>
</body>
</html>
