<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>千研投资 · 公司档案</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
  color:#1f1f1f;background:#f5f7fa;line-height:1.6;min-height:100vh
}
.container{max-width:1100px;margin:0 auto;padding:40px 24px 80px}
.header{margin-bottom:32px}
.header h1{font-size:26px;font-weight:700;color:#1a365d;letter-spacing:1px}
.header p{font-size:14px;color:#6a7a8a;margin-top:6px}
.header .divider{height:2px;background:linear-gradient(to right,#1a365d,transparent);margin-top:14px;width:100px}
.search-bar{position:relative;margin-bottom:28px}
.search-bar input{
  width:100%;padding:12px 16px 12px 44px;border:1px solid #dde2ea;border-radius:8px;
  font-size:15px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s;
  font-family:inherit
}
.search-bar input:focus{border-color:#1f4ea8;box-shadow:0 0 0 3px rgba(31,78,168,.1)}
.search-bar .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#8a9aaa;font-size:18px}
.category{margin-bottom:36px}
.category h2{
  font-size:14px;font-weight:600;color:#4a5a6a;margin-bottom:12px;
  display:flex;align-items:center;gap:8px
}
.category h2 .badge{font-size:11px;padding:2px 10px;border-radius:10px;font-weight:600}
.badge.a{background:#1a365d;color:#fff}
.badge.b{background:#f0e8c8;color:#8a6a20}
.badge.c{background:#fce8e8;color:#a32a2a}
.badge.d{background:#e8edf5;color:#4a5a7a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{
  display:flex;flex-direction:column;padding:16px 18px;background:#fff;
  border:1px solid #e2e8f0;border-radius:8px;text-decoration:none;color:inherit;
  transition:box-shadow .15s,transform .15s,border-color .15s
}
.card:hover{box-shadow:0 3px 12px rgba(0,0,0,.06);transform:translateY(-1px);border-color:#b8c5d6}
.card .top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px}
.card .name{font-size:15px;font-weight:600;color:#1a365d}
.card .code{font-size:12px;color:#6a7a8a;font-family:"JetBrains Mono",monospace}
.card .mark{
  display:inline-flex;align-items:center;justify-content:center;
  width:28px;height:28px;border-radius:8px;font-size:12px;font-weight:700;flex-shrink:0
}
.mk-S{background:#1a365d;color:#fff}
.mk-A{background:#1f4ea8;color:#fff}
.mk-A_{background:#5a7ab8;color:#fff}
.mk-B{background:#8a9aaa;color:#fff}
.mk-B_{background:#aab0ba;color:#fff}
.card .meta{font-size:12px;color:#8a9aaa;margin-top:4px}
.card .tags{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.card .tag{font-size:10px;padding:1px 8px;border-radius:8px;background:#f0f4f9;color:#5a6a7a}
.card.hidden{display:none}
.no-results{text-align:center;padding:60px 0;color:#8a9aaa;font-size:15px;display:none}
.footer{margin-top:48px;padding-top:20px;border-top:1px solid #e2e8f0;font-size:13px;color:#8a9aaa;text-align:center}
@media(max-width:480px){
  .container{padding:24px 16px 60px}
  .header h1{font-size:22px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="container">

<div class="header">
<h1>千研投资 · 公司档案</h1>
<p>制造业价值投资分析框架 · 32 家公司深度研究</p>
<div class="divider"></div>
</div>

<div class="search-bar">
<span class="icon">&#128269;</span>
<input type="text" id="q" placeholder="搜索公司名称或代码..." oninput="doSearch()">
</div>

<div id="cats"></div>
<div class="no-results" id="none">没有符合条件的公司</div>

<footer class="footer">
<p>千研投资 · 知识库驱动的研究输出</p>
</footer>

</div>

<script>
const COMP = [];

async function start() {
  try {
    const r = await fetch('data/companies.json');
    const raw = await r.json();
    raw.forEach(function(c) { COMP.push(c); });
    render();
  } catch(e) {
    document.getElementById('cats').innerHTML = '<p style="color:#a32a2a">数据加载失败</p>';
  }
}

function render() {
  var q = (document.getElementById('q').value || '').trim().toLowerCase();
  var groups = [
    {key:'a', label:'重点跟踪'},
    {key:'b', label:'等待观察'},
    {key:'c', label:'博反弹'},
    {key:'d', label:'研究对照'}
  ];
  var html = '';
  var hasAny = false;
  
  groups.forEach(function(g) {
    var items = [];
    COMP.forEach(function(c) {
      if (c.category !== g.label) return;
      if (q && c.name.indexOf(q) === -1 && c.name.toLowerCase().indexOf(q) === -1 && c.code.toLowerCase().indexOf(q) === -1) return;
      items.push(c);
    });
    if (items.length === 0 && q) return;
    if (items.length > 0) hasAny = true;
    
    var cards = '';
    items.forEach(function(c) {
      var rk = c.rating.replace('+','').replace('-','_');
      cards += '<a class="card" href="' + c.id + '/">' +
        '<div class="top"><div><div class="name">' + c.name + '</div><div class="code">' + c.code + '</div></div>' +
        '<div class="mark mk-' + rk + '">' + c.rating + '</div></div>' +
        '<div class="meta">确定性: ' + c.certainty + ' · 安全边际: ' + c.margin + '</div>' +
        '<div class="tags"><span class="tag">更新 ' + c.updated + '</span></div></a>';
    });
    
    html += '<div class="category"><h2><span class="badge ' + g.key + '">' + g.label + '</span> <span style="font-weight:400;color:#8a9aaa;font-size:12px">' + items.length + '家</span></h2>' +
      '<div class="grid">' + cards + '</div></div>';
  });
  
  document.getElementById('cats').innerHTML = html;
  document.getElementById('none').style.display = hasAny ? 'none' : 'block';
}

function doSearch() { render(); }

start();
</script>
</body>
</html>
