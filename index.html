<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>千研投资 · 公司档案</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-size:15px}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;color:#1f1f1f;background:#f5f7fa;display:flex}

/* ===== Sidebar ===== */
.sidebar{width:280px;min-width:280px;background:#1a2639;color:#d0d8e4;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.sidebar .title{padding:20px 18px 12px;font-size:16px;font-weight:700;color:#fff;letter-spacing:1px}
.sidebar .subtitle{padding:0 18px 14px;font-size:12px;color:#7a8aaa;border-bottom:1px solid #2a3a55}
.sidebar .search-box{padding:12px 14px}
.sidebar .search-box input{width:100%;padding:8px 12px;border-radius:6px;border:1px solid #2a3a55;background:#1f2d45;color:#d0d8e4;font-size:13px;outline:none;font-family:inherit}
.sidebar .search-box input:focus{border-color:#4a7acc;background:#23324d}
.sidebar .search-box input::placeholder{color:#5a6a8a}
.sidebar .list{flex:1;overflow-y:auto;padding:4px 0}
.sidebar .list::-webkit-scrollbar{width:4px}
.sidebar .list::-webkit-scrollbar-thumb{background:#3a4a6a;border-radius:2px}
.company-item{display:flex;align-items:center;justify-content:space-between;padding:8px 18px;cursor:pointer;transition:background .12s;border-left:3px solid transparent}
.company-item:hover{background:#1f2d45}
.company-item.active{background:#23324d;border-left-color:#4a7acc}
.company-item .cname{font-size:14px;color:#d0d8e4}
.company-item .ccode{font-size:11px;color:#5a7a9a;font-family:"JetBrains Mono",monospace}
.company-item .crating{font-size:10px;padding:1px 7px;border-radius:6px;font-weight:600}
.cr-S{background:#2a4a7a;color:#8ab4f8}
.cr-A{background:#1a3a6a;color:#6a9aee}
.cr-A_{background:#3a4a6a;color:#8aa0c0}
.cr-B{background:#4a4a4a;color:#aaa}
.cr-B_{background:#3a3a3a;color:#999}
.hidden{display:none!important}
.company-item .cat-dot{width:6px;height:6px;border-radius:50%;margin-right:8px;flex-shrink:0}
.dot-key{background:#4a7acc}
.dot-watch{background:#c9a84c}
.dot-rebound{background:#c97a4a}
.dot-ref{background:#7a8aaa}

/* ===== Main ===== */
.main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ===== Top Nav ===== */
.topnav{display:flex;align-items:center;gap:4px;padding:12px 20px;background:#fff;border-bottom:1px solid #e2e8f0;overflow-x:auto;flex-shrink:0}
.topnav::-webkit-scrollbar{height:2px}
.topnav::-webkit-scrollbar-thumb{background:#d0d8e0;border-radius:1px}
.nav-btn{padding:6px 14px;font-size:13px;border-radius:6px;border:none;cursor:pointer;white-space:nowrap;background:transparent;color:#5a6a7a;font-family:inherit;transition:all .12s}
.nav-btn:hover{background:#f0f4f9;color:#1f4ea8}
.nav-btn.active{background:#1f4ea8;color:#fff;font-weight:600}
.nav-placeholder{padding:12px 20px;font-size:14px;color:#8a9aaa;flex-shrink:0;background:#fff;border-bottom:1px solid #e2e8f0}

/* ===== Content ===== */
.content{flex:1;overflow-y:auto;padding:0;background:#f5f7fa}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-thumb{background:#d0d8e0;border-radius:3px}
.content-inner{padding:28px 32px 60px;max-width:900px;margin:0 auto}

/* ===== Content styles (same as card pages) ===== */
.content-inner{font-size:15px;color:#14181f;line-height:1.65}
.content-inner h1{font-size:20px;font-weight:700;margin:0 0 10px;color:#1a365d}
.content-inner h2{font-size:1.2rem;font-weight:700;color:#14181f;margin:1.8em 0 .6em;padding-left:12px;border-left:4px solid #1f4ea8}
.content-inner h3{font-size:1.05rem;font-weight:600;color:#3c4451;margin:1.4em 0 .5em}
.content-inner p{margin-bottom:1em;text-align:justify}
.content-inner hr{border:none;height:1px;background:#dde2ea;margin:1.8em 0}
.content-inner blockquote{margin:1em 0;padding:12px 16px;background:#e8edf5;border-left:4px solid #1f4ea8;color:#3c4451;font-size:14px;line-height:1.5;border-radius:0 4px 4px 0}
.content-inner blockquote p{margin-bottom:0}
.content-inner strong{color:#14181f;font-weight:700}
.content-inner code{font-family:"JetBrains Mono","SF Mono",monospace;background:#e8edf5;padding:2px 6px;border-radius:3px;font-size:13px;color:#1f4ea8}
.content-inner pre{background:#f1f4f9;border:1px solid #dde2ea;border-radius:6px;padding:14px 18px;margin:12px 0;overflow-x:auto;font-size:13px;line-height:1.5;font-family:"JetBrains Mono","SF Mono",monospace;color:#16213a}
.content-inner pre code{background:none;padding:0;color:#16213a}
.content-inner li{margin-bottom:4px;line-height:1.6;margin-left:20px}
.content-inner table{width:100%;border-collapse:collapse;margin:1em 0;font-size:13px;line-height:1.5;overflow-x:auto;display:block}
.content-inner table th{background:#1f4ea8;color:#fff;font-weight:600;padding:8px 12px;border:1px solid #1f4ea8;text-align:left;font-size:12px}
.content-inner table td{padding:7px 12px;border:1px solid #dde2ea;vertical-align:top}
.content-inner table tbody tr:nth-child(even) td{background:#fafbfd}
.content-inner .pos{color:#1c6e3d;font-weight:600}
.content-inner .neg{color:#a32a2a;font-weight:600}
.content-inner .warn{color:#c97a1a;font-weight:600}
.welcome{padding:40px 0;text-align:center}
.welcome h2{font-size:20px;color:#1a365d;margin-bottom:12px}
.welcome p{font-size:14px;color:#8a9aaa;line-height:1.7}

/* ===== Loading ===== */
.loading{text-align:center;padding:40px;color:#8a9aaa;font-size:14px}

/* ===== Mobile ===== */
@media(max-width:768px){
  .sidebar{width:60px;min-width:60px}
  .sidebar .title,.sidebar .subtitle,.sidebar .search-box,.company-item .cname,.company-item .ccode,.company-item .crating{display:none}
  .company-item{padding:12px;justify-content:center}
  .company-item .cat-dot{margin:0}
  .content-inner{padding:20px 16px 40px}
  .topnav{padding:8px 12px;gap:2px}
  .nav-btn{padding:4px 10px;font-size:12px}
}
</style>
</head>
<body>

<!-- ===== Sidebar ===== -->
<div class="sidebar" id="sidebar">
<div class="title">千研投资</div>
<div class="subtitle">公司档案 · 32家</div>
<div class="search-box">
<input type="text" id="q" placeholder="搜索公司名称或代码..." oninput="filterSidebar()">
</div>
<div class="list" id="companyList"></div>
</div>

<!-- ===== Main ===== -->
<div class="main">
<div id="navArea" class="nav-placeholder">请从左侧选择一家公司</div>
<div class="content" id="contentArea">
<div class="content-inner" id="contentInner">
<div class="welcome">
<h2>千研投资 · 公司档案</h2>
<p>制造业价值投资分析框架驱动的深度研究<br>从左侧列表选择一家公司开始浏览</p>
</div>
</div>
</div>
</div>

<script>
const COMP = [];
const CARDS = ['海大集团总览','商业模式','成长性','盈利能力','估值','风险','影响因素','逻辑链路','跟踪清单','公司发展历程','变更记录'];
var activeCompany = null;
var activeCard = null;

async function init() {
  try {
    const r = await fetch('data/companies.json');
    const raw = await r.json();
    raw.forEach(function(c){COMP.push(c);});
    renderSidebar();
  } catch(e) {
    document.getElementById('companyList').innerHTML = '<div style="padding:20px;color:#a32a2a;font-size:13px">数据加载失败</div>';
  }
}

function renderSidebar() {
  var q = (document.getElementById('q').value || '').trim().toLowerCase();
  var html = '';
  COMP.forEach(function(c) {
    if (q && c.name.indexOf(q) === -1 && c.name.toLowerCase().indexOf(q) === -1 && c.code.toLowerCase().indexOf(q) === -1) return;
    var rk = c.rating.replace('+','').replace('-','_');
    var dots = {key:'dot-key',watch:'dot-watch',rebound:'dot-rebound',ref:'dot-ref'};
    var dk = c.category === '重点跟踪' ? 'key' : c.category === '等待观察' ? 'watch' : c.category === '博反弹' ? 'rebound' : 'ref';
    var cls = activeCompany && activeCompany.id === c.id ? 'active' : '';
    html += '<div class="company-item ' + cls + '" onclick="selectCompany('' + c.id + '')">' +
      '<div style="display:flex;align-items:center"><span class="cat-dot ' + dots[dk] + '"></span>' +
      '<div><div class="cname">' + c.name + '</div><div class="ccode">' + c.code + '</div></div></div>' +
      '<span class="crating cr-' + rk + '">' + c.rating + '</span></div>';
  });
  if (!html) html = '<div style="padding:20px;color:#5a7a9a;font-size:13px;text-align:center">无匹配结果</div>';
  document.getElementById('companyList').innerHTML = html;
}

function filterSidebar() { renderSidebar(); }

function selectCompany(id) {
  var c = null;
  for (var i = 0; i < COMP.length; i++) { if (COMP[i].id === id) { c = COMP[i]; break; } }
  if (!c) return;
  activeCompany = c;
  activeCard = null;
  
  // Update sidebar active state
  renderSidebar();
  
  // Build nav tabs - dynamically based on company folder
  var navHtml = '';
  var cardLabels = {
    '海大集团总览':'总览','商业模式':'商业模式','成长性':'成长性','盈利能力':'盈利能力',
    '估值':'估值','风险':'风险','影响因素':'影响因素','逻辑链路':'逻辑链路',
    '跟踪清单':'跟踪清单','公司发展历程':'发展历程','变更记录':'变更记录'
  };
  
  // For now use the standard card list - in future we could fetch per-company
  for (var j = 0; j < CARDS.length; j++) {
    var label = cardLabels[CARDS[j]] || CARDS[j];
    navHtml += '<button class="nav-btn" onclick="loadCard('' + CARDS[j] + '',this)">' + label + '</button>';
  }
  
  document.getElementById('navArea').innerHTML = navHtml;
  document.getElementById('contentInner').innerHTML = '<div class="loading">选择一张卡片查看详细内容</div>';
}

function loadCard(cardName, btn) {
  activeCard = cardName;
  
  // Update nav active state
  var btns = document.querySelectorAll('.nav-btn');
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
  if (btn) btn.classList.add('active');
  
  // Show loading
  document.getElementById('contentInner').innerHTML = '<div class="loading">加载中...</div>';
  
  // Fetch the card HTML
  var url = activeCompany.id + '/' + cardName + '.html';
  fetch(url).then(function(r) {
    if (!r.ok) throw new Error('Not found');
    return r.text();
  }).then(function(html) {
    // Extract the .body content from the fetched HTML
    var parser = new DOMParser();
    var doc = parser.parseFromString(html, 'text/html');
    var body = doc.querySelector('.body');
    var title = doc.querySelector('.header h1');
    var contentHtml = '';
    if (body) {
      contentHtml = body.innerHTML;
    } else {
      // Fallback: try to get main content
      var main = doc.querySelector('.container');
      contentHtml = main ? main.innerHTML : html;
    }
    
    // Build the heading
    var heading = '<h1>' + activeCompany.name + ' · ' + (cardName.replace('海大集团','')) + '</h1>';
    if (title) heading = '<h1>' + title.textContent + '</h1>';
    
    document.getElementById('contentInner').innerHTML = heading + contentHtml;
  }).catch(function(err) {
    document.getElementById('contentInner').innerHTML = '<div class="loading">加载失败: ' + err.message + '</div>';
  });
}

init();
</script>
</body>
</html>
